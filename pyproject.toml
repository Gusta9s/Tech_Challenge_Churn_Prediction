[project]
name = "tech-challenge-churn-prediction"
version = "0.1.13"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gusta9s", email = "gustavoapacheco@yahoo.com.br" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0,<0.144.0",
    "pandas>=3.0.6,<4.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "scikit-learn>=1.9.1,<2.0.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
]

[project.scripts]
tech-challenge-churn-prediction = "tech_challenge_churn_prediction:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1,<27.0.0",
    "flake8>=7.4.1,<8.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-mock>=3.16.0,<4.0.0",
    "xlrd>=2.0.2,<3.0.0",
    "xlwt>=1.3.0,<2.0.0",
]
# Dependencias usadas apenas nos notebooks de treinamento/EDA (dvc, graficos,
# balanceamento de classes). Nao sao importadas por src/, entao ficam fora
# do requirements.txt exportado para a imagem Docker da API, mantendo o
# runtime de inferencia enxuto. Instaladas por padrao localmente via
# `[tool.uv] default-groups` para nao quebrar o fluxo de notebooks/DVC.
notebooks = [
    "dvc>=3.67.1,<4.0.0",
    "imbalanced-learn>=0.14.2,<0.15.0",
    "ipykernel>=7.4.0,<8.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "matplotlib>=3.11.2,<4.0.0",
    "nbconvert>=7.17.2,<8.0.0",
    "seaborn>=0.13.2,<0.14.0",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 79
target-version = ["py314"]

[tool.coverage.run]
source = ["src/tech_challenge_churn_prediction"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
