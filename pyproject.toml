[project]
name = "tech-challenge-churn-prediction"
version = "0.1.11"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gusta9s", email = "gustavoapacheco@yahoo.com.br" }
]
requires-python = ">=3.14"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.143.0",
    "imbalanced-learn>=0.13.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tech-challenge-churn-prediction = "tech_challenge_churn_prediction:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "xlrd>=2.0.2",
    "xlwt>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 79
target-version = ["py314"]

[tool.coverage.run]
source = ["src/tech_challenge_churn_prediction"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
